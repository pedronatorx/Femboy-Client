plugins {
	// 1.21.11 is the last obfuscated Minecraft release, so it needs the remapping variant of Loom.
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"femboyclient" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		configureEach {
			// Keeps dev and test clients from claiming a large default heap on shared machines.
			vmArg "-Xmx2G"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// JUnit 5 inside a Fabric Loader environment, so tests may also touch Minecraft classes.
	testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
}

fabricApi {
	configureTests {
		// Creates the "gametest" source set with its own fabric.mod.json, plus the
		// runGameTest (headless server) and runClientGameTest (real client) tasks.
		createSourceSet = true
		modId = "femboyclient-gametest"
		enableGameTests = true
		enableClientGameTests = true
		eula = true // Accepts the Minecraft EULA for the throwaway test server/worlds.
	}
}

test {
	useJUnitPlatform()
	// fabric-loader-junit starts Minecraft's logging, which writes logs/ and mods/ into the working directory.
	def testRunDir = layout.buildDirectory.dir("test-run").get().asFile
	workingDir = testRunDir
	doFirst { testRunDir.mkdirs() }
	systemProperty "femboyclient.projectDir", projectDir.absolutePath
	testLogging {
		events "passed", "skipped", "failed"
		exceptionFormat "full"
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()

	// Loom 1.18 itself needs Gradle to run on JDK 25+, but Minecraft 1.21.11 targets Java 21.
	// The toolchain makes compilation, unit tests and the dev/test game clients use JDK 21.
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}
